; LiFePO4 Tester - ESP32 D1 mini
; Compila con PlatformIO (VS Code) oppure apri LiFePO4_Tester/LiFePO4_Tester.ino con Arduino IDE.
; Nessuna libreria esterna richiesta: bastano le librerie del core ESP32.

[platformio]
default_envs = d1mini_esp32
src_dir = LiFePO4_Tester

[env:d1mini_esp32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default.csv      ; 4 MB: app 1.2 MB + spiffs/littlefs 1.5 MB
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0

<!-- ===== note ===== -->
 <text x="12" y="478" font-size="11" fill="#222">⏚ Tutte le masse (GND ESP32, GND sensore, GND modulo relè, pin 85 del relè automotive, IN− del buck, R2) vanno al <tspan font-weight="bold">B− lato batteria</tspan>, cioè PRIMA dello shunt.</text>
 <text x="12" y="494" font-size="11" fill="#222">Cavi sense corti e intrecciati, presi dalle viti piccole dello shunt (ingresso + lato carico, ingresso − lato batteria). Cavi di potenza 4 mm² per 20 A. Opzionale: NTC 10 kΩ su GPIO35 (HARDWARE.md).</text>
 <text x="12" y="510" font-size="11" fill="#222">Alimentazione: power bank nella porta USB (consigliato) OPPURE buck XL4015/LM2596 regolato a 5,0 V prima di collegarlo, mai entrambi. ADS1115 e modulo relè dal pin 3V3.</text>
 <text x="12" y="526" font-size="11" fill="#222">Relè: il modulo 3 V da solo regge ≤ 5 A in DC, per i 20 A pilota la bobina del relè automotive (86 dal contatto NO, 85 a massa). Contatti 30/87 in serie al B+ del carico.</text>
 <text x="12" y="542" font-size="11" fill="#222">Carico: 512 W scaldano 50 L di ~9 °C all'ora; con 10 L l'acqua bolle in 1,5 h. Acqua demineralizzata, secchio di plastica, stanza aerata. Corrente positiva = scarica (altrimenti "Inverti segno").</text>
</svg>

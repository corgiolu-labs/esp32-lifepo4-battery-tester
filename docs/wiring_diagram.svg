 <circle cx="900" cy="30" r="3.5" fill="#d62828"/>
 <line x1="925" y1="220" x2="925" y2="240" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
 <line x1="915" y1="240" x2="935" y2="240" stroke="#333" stroke-width="1.5"/>
 <line x1="919" y1="245" x2="931" y2="245" stroke="#333" stroke-width="1.5"/>
 <line x1="923" y1="250" x2="927" y2="250" stroke="#333" stroke-width="1.5"/>

 <text x="12" y="478" font-size="11" fill="#222">⏚ All grounds (ESP32, sensor, relay module, pin 85 of the automotive relay, buck IN−, R2) go to <tspan font-weight="bold">B− on the battery side</tspan>, i.e. BEFORE the shunt.</text>
 <text x="12" y="494" font-size="11" fill="#222">Sense wires short and twisted, taken from the small screws of the shunt (+ input on the load side, − input on the battery side). Power cables 4 mm² for 20 A. Optional: 10 kΩ NTC on GPIO35 (see HARDWARE.md).</text>
 <text x="12" y="510" font-size="11" fill="#222">Power: a power bank on the USB port (recommended) OR an XL4015/LM2596 buck set to 5.0 V before connecting it, never both. ADS1115 and relay module are fed from the 3V3 pin.</text>
 <text x="12" y="526" font-size="11" fill="#222">Relay: the 3 V module alone handles ≤ 5 A DC; for 20 A it drives the coil of the automotive relay (86 from the NO contact, 85 to ground). Contacts 30/87 in series with the load B+.</text>
 <text x="12" y="542" font-size="11" fill="#222">Load: 512 W heat 50 L by ~9 °C per hour; 10 L would boil in 1.5 h. Demineralised water, plastic tub, ventilated room. Positive current = discharge (otherwise use "Inverti segno" = invert sign).</text>
</svg>
